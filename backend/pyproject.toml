[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devguard-ai"
version = "1.0.0"
description = "AI-Powered DevOps Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "structlog>=24.4.0",
    "PyJWT[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
# Repositories intentionally narrow the generic ORM-model-typed base class to
# domain-entity return types at each concrete boundary (Clean Architecture
# repository pattern) — pragmatic, deliberate LSP-style narrowing rather than
# an error.
disable_error_code = ["override"]

# Pre-existing typing gaps in modules outside this task's approved scope
# (schema/models/migrations/seeds/tests). Left as follow-up items rather than
# touched here to avoid unrelated API-layer changes.
[[tool.mypy.overrides]]
module = "app.main"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.api.v1.endpoints.health"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.infrastructure.database.session"
ignore_errors = true
