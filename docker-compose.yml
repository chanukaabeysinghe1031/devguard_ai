services:
  postgres:
    image: postgres:16-alpine
    container_name: devguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-devguard_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devguard} -d ${POSTGRES_DB:-devguard_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: devguard_chromadb
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devguard_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      CHROMA_HOST: chromadb
    volumes:
      - ./backend:/app
      - upload_data:/app/data/uploads
      - model_data:/app/data/models
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
  chroma_data:
  upload_data:
  model_data:
